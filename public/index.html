<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Codeniac</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/life.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/premium.css">
  <link rel="stylesheet" href="/custom.css">
  <script type="module">
    import { applyTheme } from '/js/theme.js';
    try { const l = JSON.parse(localStorage.getItem('codeniac.look') || 'null'); if (l) applyTheme(l); } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="rail-left" id="sidebar" aria-label="Menu"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div class="content"><div id="view"></div></div>
    </main>
    <aside class="rail-right" id="rail" aria-label="Atalhos"></aside>
  </div>
  <aside class="assistant" id="assistant" aria-label="Assistente"></aside>
  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação"></nav>
  <div class="overlay"></div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

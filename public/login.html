<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d2b">
  <title>Entrar · Codeniac Society</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    :root { --bg: #0a0d2b; --panel: #141a4a; --card: #1d2468; --line: #262e78; --line2: #313a92; --violet: #6c4cf5; --gold: #f7c948; --text: #eef0ff; --mut: #8a91cc; --green: #2fd27a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font-family: 'Poppins', system-ui, sans-serif; overflow-x: hidden; }
    .px { image-rendering: pixelated; image-rendering: crisp-edges; }
    .city { position: fixed; inset: 0; background: url('/assets/pixel/scene-cidade.png') center / cover no-repeat; image-rendering: pixelated; filter: saturate(.9); }
    .city::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,13,43,.55), rgba(10,13,43,.92) 70%); }
    body.has-bg .city { background-image: var(--login-bg); }
    .wrap { position: relative; z-index: 1; min-height: 100dvh; display: grid; place-items: center; padding: 26px 16px; }
    .box { width: min(440px, 100%); display: grid; gap: 16px; }
    .logo { display: grid; justify-items: center; gap: 6px; text-align: center; }
    .logo img.sky { width: 220px; height: 82px; border-radius: 14px; border: 3px solid var(--line2); object-fit: cover; }
    .logo b, .logo small { font-family: 'Press Start 2P', monospace; letter-spacing: .04em; }
    .logo b { font-size: 24px; color: #fff; text-shadow: 3px 3px 0 #5538d6; }
    .logo small { font-size: 14px; color: var(--gold); text-shadow: 3px 3px 0 #6b3d00; }
    .logo img.custom { height: 54px; width: auto; }
    .faces { display: flex; justify-content: center; gap: 6px; }
    .faces img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--line2); background: var(--panel); }
    .card { padding: 22px 22px 20px; border-radius: 18px; background: var(--panel); border: 3px solid var(--line2); box-shadow: 0 6px 0 rgba(4,6,26,.6); }
    .card h1 { margin: 0 0 2px; font-size: 20px; } .card .sub { margin: 0 0 16px; color: var(--mut); font-size: 12.5px; }
    .tabs { display: flex !important; width: 100%; gap: 4px; padding: 4px; border-radius: 12px; background: #10164a; margin-bottom: 16px; }
    .tabs button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 9px; font: inherit; font-size: 12.5px; color: var(--mut); cursor: pointer; }
    .tabs button.on { background: var(--violet); color: #fff; }
    .field { display: grid; gap: 5px; margin-bottom: 12px; } .field label { font-size: 12px; color: var(--mut); font-weight: 600; }
    .field input { height: 46px; padding: 0 14px; border-radius: 12px; background: #10164a; border: 2px solid var(--line2); color: var(--text); font: inherit; font-size: 14px; outline: 0; }
    .field input:focus { border-color: var(--violet); }
    .pass { position: relative; } .pass input { width: 100%; padding-right: 46px; }
    .pass button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; background: none; color: var(--mut); border-radius: 9px; display: grid; place-items: center; cursor: pointer; }
    #go { width: 100%; height: 50px; margin-top: 6px; border-radius: 13px; border: 2px solid #8b6dff; background: var(--violet); color: #fff; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 4px 0 rgba(4,6,26,.6); }
    #go:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(4,6,26,.6); } #go:disabled { opacity: .6; }
    .msg-box { margin-top: 12px; font-size: 12px; padding: 10px 12px; border-radius: 11px; background: rgba(255,77,94,.14); color: #ff9aa5; }
    .demo { margin-top: 14px; font-size: 11.5px; color: var(--mut); border-top: 2px solid var(--line); padding-top: 12px; } .demo code { color: var(--text); }
    .alive { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--mut); }
    .alive i { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(47,210,122,.18); }
    #loginMsg { text-align: center; margin: 0; font-size: 12.5px; color: #c2c6ef; }
    @media (max-width: 420px) { .logo b { font-size: 19px; } .logo small { font-size: 11px; } }
  </style>
</head>
<body>
  <div class="city px"></div>
  <main class="wrap"><div class="box">
    <div class="logo"><img class="sky px" src="/assets/pixel/skyline-wide.png" alt="" id="sky"><img class="custom px" id="logo" alt="" hidden><b>CODENIAC</b><small>SOCIETY</small></div>
    <p id="loginMsg">Uma cidade viva de personagens de IA. Entre e continue sua história.</p>
    <div class="faces" id="faces"></div>
    <section class="card">
      <h1 id="hTitle">Bem-vindo de volta</h1><p class="sub" id="hSub">Entre para continuar</p>
      <div class="tabs" id="tabs" hidden><button type="button" data-tab="login" class="on">Entrar</button><button type="button" data-tab="register">Criar conta</button></div>
      <form id="form">
        <div class="field" id="nameField" hidden><label for="name">Nome</label><input id="name" name="name" autocomplete="name"></div>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Senha</label><div class="pass"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
          <button type="button" id="eye" aria-label="Mostrar senha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
        <button id="go">Entrar</button>
      </form>
      <div class="msg-box" id="err" hidden></div>
      <div class="demo" id="demo" hidden>Primeiro acesso: <code>admin@codeniac.dev</code> / <code>codeniac123</code>. Depois, troque o e-mail e a senha em <b>Perfil</b>.</div>
    </section>
    <div class="alive" id="foot"><i></i> Nexus City está online · seus dados ficam no seu computador</div>
  </div></main>
  <script type="module">
    const $ = (s) => document.querySelector(s);
    // moradores da cidade (rostos em pixel) na entrada
    const pick = new Set(); while (pick.size < 7) pick.add(Math.floor(Math.random() * 123));
    $('#faces').innerHTML = [...pick].map((i) => `<img class="px" src="/assets/px/p${String(i).padStart(3, '0')}.png" alt="">`).join('');
    if (localStorage.getItem('codeniac.token')) {
      fetch('/api/auth/me', { headers: { Authorization: `Bearer ${localStorage.getItem('codeniac.token')}` } }).then((r) => { if (r.ok) location.replace('/'); });
    }
    let mode = 'login';
    const info = await fetch('/api/system/info').then((r) => r.json()).catch(() => ({}));
    if (info.images?.logo) { $('#logo').src = info.images.logo; $('#logo').hidden = false; $('#sky').hidden = true; }
    if (info.images?.loginBg) { document.body.style.setProperty('--login-bg', `url('${info.images.loginBg}')`); document.body.classList.add('has-bg'); }
    if (info.loginMessage) $('#loginMsg').textContent = info.loginMessage;
    if (info.allowRegistration) $('#tabs').hidden = false;
    if (info.demoAccount) $('#demo').hidden = false;
    $('#eye').addEventListener('click', () => { const i = $('#password'); i.type = i.type === 'password' ? 'text' : 'password'; });
    const setMode = (m) => {
      mode = m;
      document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === m));
      $('#nameField').hidden = m !== 'register';
      $('#name').required = m === 'register';
      $('#go').textContent = m === 'register' ? 'Criar conta' : 'Entrar';
      $('#hTitle').textContent = m === 'register' ? 'Criar sua conta' : 'Bem-vindo de volta';
      $('#hSub').textContent = m === 'register' ? 'Leva menos de um minuto' : 'Entre para continuar';
      $('#password').autocomplete = m === 'register' ? 'new-password' : 'current-password';
    };
    document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.tab)));
    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#err').hidden = true; $('#go').disabled = true;
      const body = { email: $('#email').value.trim(), password: $('#password').value, name: $('#name').value.trim() };
      try {
        const res = await fetch(`/api/auth/${mode}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Não foi possível entrar');
        localStorage.setItem('codeniac.token', data.token);
        location.replace('/');
      } catch (err) { $('#err').textContent = err.message; $('#err').hidden = false; $('#go').disabled = false; }
    });
  </script>
</body>
</html>
